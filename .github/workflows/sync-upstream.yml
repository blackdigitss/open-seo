name: Sync upstream

# Watches every-app/open-seo RELEASE TAGS and opens a reviewable PR when a new
# one appears. Upstream never lands on `main` on its own — you read the PR and
# decide. Tags, not HEAD: the maintainer reverts within the week often enough
# that Monday's HEAD is not a safe merge target.
on:
  schedule:
    - cron: "0 13 * * 1" # Mondays 13:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream tags
        run: |
          git remote add upstream https://github.com/every-app/open-seo.git
          git fetch upstream --tags

      - name: Find newest release not yet in main
        id: check
        run: |
          TAG=$(git tag --list 'v*' --sort=-version:refname | head -1)
          AHEAD=$(git rev-list --count origin/main.."$TAG")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ahead=$AHEAD" >> "$GITHUB_OUTPUT"
          echo "Newest release $TAG is $AHEAD commit(s) ahead of main."
          {
            echo 'log<<COMMITS'
            git log --oneline --no-decorate origin/main.."$TAG" | head -60
            echo COMMITS
          } >> "$GITHUB_OUTPUT"
          {
            echo 'notes<<NOTES'
            git diff --name-only "$(git merge-base origin/main "$TAG")".."$TAG" -- release-notes/
            echo NOTES
          } >> "$GITHUB_OUTPUT"

      - name: Attempt merge
        if: steps.check.outputs.ahead != '0'
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="sync/upstream-${{ steps.check.outputs.tag }}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          git checkout -B "$BRANCH" origin/main
          if git merge --no-edit "${{ steps.check.outputs.tag }}"; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
            git push -f origin "$BRANCH"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
            {
              echo 'conflicts<<EOF'
              git diff --name-only --diff-filter=U
              echo EOF
            } >> "$GITHUB_OUTPUT"
            git merge --abort
          fi

      - name: Open PR
        if: steps.check.outputs.ahead != '0' && steps.merge.outputs.clean == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh pr list --head "${{ steps.merge.outputs.branch }}" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already open."; exit 0
          fi
          gh pr create \
            --base main \
            --head "${{ steps.merge.outputs.branch }}" \
            --title "Sync upstream ${{ steps.check.outputs.tag }}" \
            --body "$(cat <<'BODY'
          Merged upstream release `${{ steps.check.outputs.tag }}` cleanly. Read the
          release notes in the diff before merging — that is what actually shipped.

          **Checklist**
          - [ ] Release notes reviewed; the changes are ones we want
          - [ ] `pnpm install && pnpm build && pnpm test` pass
          - [ ] Every hook in `FORK.md` still intact (`grep -rn "FORK:" src *.jsonc`)
          - [ ] Redeploy after merge: `pnpm deploy:selfhost --yes`

          ### Release notes touched
          ```
          ${{ steps.check.outputs.notes }}
          ```

          ### Upstream commits
          ```
          ${{ steps.check.outputs.log }}
          ```
          BODY
          )"

      - name: Open issue on conflict
        if: steps.check.outputs.ahead != '0' && steps.merge.outputs.clean == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Upstream ${{ steps.check.outputs.tag }} needs a manual merge"
          EXISTING=$(gh issue list --search "$TITLE in:title" --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            echo "Issue #$EXISTING already open."; exit 0
          fi
          gh issue create --title "$TITLE" --body "$(cat <<'BODY'
          Upstream released `${{ steps.check.outputs.tag }}` but the merge conflicts
          with our customizations.

          Resolve locally:
          ```bash
          ./scripts/sync-upstream.sh --merge
          ```
          If `src/routeTree.gen.ts` is among the conflicts, regenerate it rather
          than resolving by hand (the script prints the command).

          ### Conflicting files
          ```
          ${{ steps.merge.outputs.conflicts }}
          ```

          ### Upstream commits
          ```
          ${{ steps.check.outputs.log }}
          ```
          BODY
          )"
